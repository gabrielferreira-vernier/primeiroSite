<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="login-container">
      <section class="login-card" aria-label="Área de login">
        <div class="icone" aria-hidden="true">🔐</div>

        <h1>Entrar</h1>
        <p class="subtitulo">Acesse sua conta para continuar</p>

        <form>
          <div class="form-group">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" placeholder="seu@email.com" />
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" placeholder="Digite sua senha" />
          </div>

          <button type="submit" class="btn-login">Entrar</button>
        </form>

        <p class="recuperar-senha"><a href="#">Esqueceu sua senha?</a></p>
      </section>
    </main>
  </body>
</html>
